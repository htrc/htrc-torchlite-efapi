name: Update Dependency Graph
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HTRC_NEXUS_DRHTRC_PWD: ${{ secrets.HTRC_NEXUS_DRHTRC_PWD }}

jobs:
  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - uses: sbt/setup-sbt@v1
      - uses: actions/checkout@v7
      - uses: scalacenter/sbt-dependency-submission@v3